<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LINK CLICK | Archive Access</title>

    <link rel="stylesheet" href="nom.css">

</head>

<body>

    <!-- =====================================================
         ARCHIVE ACCESS SCREEN
    ====================================================== -->

    <main id="archive-screen">

        <!-- Background Layer -->

        <div id="background-layer">

            <div id="background-overlay"></div>

            <div id="noise-layer"></div>

            <div id="scanlines"></div>

        </div>


        <!-- Terminal Window -->

        <section id="terminal">

            <div id="terminal-header">

                <span>LINK CLICK ARCHIVE TERMINAL</span>

                <span>v2.0</span>

            </div>

            <div id="terminal-body">

                <p id="line1"></p>

                <p id="line2"></p>

                <p id="line3"></p>

                <p id="line4"></p>

                <p id="line5"></p>

            </div>

        </section>


        <!-- Archive Code -->

        <section id="archive-code-section">

            <p id="archive-label">

                CASE ID

            </p>

            <h1 id="archive-code">

                091305

            </h1>

        </section>


        <!-- Access Granted -->

        <section id="access-section">

            <h2 id="access-message">

                ACCESS GRANTED

            </h2>

            <p id="archive-title">

                LINK CLICK

            </p>

            <span id="archive-subtitle">

                DIGITAL ARCHIVE

            </span>

        </section>


        <!-- Enter -->

        <section id="enter-section">

            <a href="home.html" id="enter-button">

                ENTER →

            </a>

        </section>


        <!-- Bottom Status -->

        <footer id="system-status">

            <div id="status-item1">

                <span>STATUS</span>

                <p id="status-text">

                    Initializing

                </p>

            </div>

            <div id="status-item2">

                <span>TIMELINE</span>

                <p>

                    UNSTABLE

                </p>

            </div>

            <div id="status-item3">

                <span>LAST PHOTO</span>

                <p>

                    13 SEP 00:05

                </p>

            </div>

            <div id="status-item4">

                <span>ACCESS LEVEL</span>

                <p>

                    RESTRICTED

                </p>

            </div>

        </footer>

    </main>


    <!-- =====================================================
         OPTIONAL SOUND EFFECT
    ====================================================== -->

    <audio id="camera-sound" preload="auto">

        <source src="assets/audio/camera.mp3" type="audio/mpeg">

    </audio>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="java.js"></script>

</body>

</html>
